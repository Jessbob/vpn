<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Web Proxy</title>
  <style>
    :root { --bg:#fff; --fg:#111; --muted:#666; --card:#f3f4f6; --accent:#2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1115; --fg:#eee; --muted:#9aa0a6; --card:#1a1d24; --accent:#60a5fa; }
    }
    body { margin:0; min-height:100vh; display:grid; place-items:center;
           background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; }
    main { width:min(520px,92vw); text-align:center; }
    form { display:flex; gap:8px; margin-top:20px; }
    input { flex:1; padding:12px; border-radius:8px; border:1px solid var(--muted);
            background:var(--card); color:var(--fg); font-size:1rem; }
    button { padding:12px 18px; border:0; border-radius:8px; background:var(--accent);
             color:#fff; font-size:1rem; cursor:pointer; }
    p { color:var(--muted); font-size:.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>My Web Proxy</h1>
    <p>Enter a website address to browse it through this server.</p>
    <form action="/proxy" method="get">
      <input name="url" placeholder="example.com" autocomplete="off" required>
      <button type="submit">Go</button>
    </form>
    <p>Simple sites work best. Logins and heavy JavaScript sites often won't.</p>
  </main>
</body>
</html>
